# Render Blueprint: one-click backend + Postgres
# See DEPLOY_RENDER_BACKEND.md

databases:
  - name: vibecheck-db
    plan: free
    databaseName: semantic_media

services:
  - type: web
    name: vibecheck-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vibecheck-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: USE_FILE_STORAGE
        value: "true"
      - key: VECTOR_SIZE
        value: "384"
      - key: VECTORIZER_TYPE
        value: "sbert"
      - key: SBERT_MODEL_NAME
        value: "all-MiniLM-L6-v2"
      - key: VECTORIZER_PATH
        value: "models"
      - key: EMBEDDINGS_PATH
        value: "embeddings"
      - key: USE_HYBRID_SEARCH
        value: "true"
